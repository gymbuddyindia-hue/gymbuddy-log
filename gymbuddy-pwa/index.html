<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GymBuddy Log</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Track personal bests for any exercise. GymBuddy India." />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymBuddy Log" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dot-grid" aria-hidden="true"></div>

  <div id="app" class="container">
    <header class="app-header">
      <div class="brand-row">
        <img src="logo.png" alt="GymBuddy" class="logo-img" />
        <div class="brand-text">GYMBUDDY <span class="brand-text-accent">LOG</span></div>
        <button id="menu-btn" class="header-icon-btn" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
          </svg>
        </button>
      </div>
      <div class="tagline">Track every PB. Beat it next time.</div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-view="log" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Log</span>
      </button>
      <button class="tab-btn" data-view="exercises" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M3 9h2v6H3z"/><path d="M19 9h2v6h-2z"/><path d="M9 7v10"/><path d="M15 7v10"/></svg>
        <span>Exercises</span>
      </button>
      <button class="tab-btn" data-view="progress" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        <span>Progress</span>
      </button>
      <button class="tab-btn" data-view="history" role="tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        <span>History</span>
      </button>
    </nav>

    <main id="view" class="view"></main>

    <footer class="app-footer">
      <img src="logo.png" alt="" class="footer-logo" />
      <span>GymBuddy India</span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <div id="ios-install-hint" class="ios-install-hint" hidden>
    <div class="ios-hint-card">
      <button class="ios-hint-close" aria-label="Close">×</button>
      <div class="ios-hint-title">Install GymBuddy Log</div>
      <div class="ios-hint-body">
        Tap <strong>Share</strong>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin: 0 4px;"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        then <strong>Add to Home Screen</strong> for offline access and a real app feel.
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
